<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avancerad Multi Search Tool</title>
  <meta name="description" content="Sök på flera svenska marknadsplatser samtidigt – Blocket, Tradera, Facebook Marketplace, Vinted med flera.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">

  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f8f9fa;
      transition: background-color 0.3s ease;
    }
    .search-card {
      width: 100%;
      max-width: 650px;
      padding: 2rem;
      background-color: #ffffff;
      border-radius: 1rem;
      box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
      transition: background-color 0.3s ease;
    }
    .btn-search {
      transition: all 0.3s ease;
    }
    .btn-search:hover {
      transform: translateY(-2px);
      box-shadow: 0 0.25rem 0.5rem rgba(0, 0, 0, 0.2);
    }
    .form-check-input:checked {
      background-color: #0d6efd;
      border-color: #0d6efd;
    }
    .dark-mode {
      background-color: #333;
      color: #fff;
    }
    .dark-mode .search-card {
      background-color: #444;
      color: #fff;
    }
    .dark-mode .form-control,
    .dark-mode .form-select {
      background-color: #555;
      color: #fff;
      border-color: #666;
    }
    .dark-mode .list-group-item {
      background-color: #555;
      color: #fff;
      border-color: #666;
    }
    .search-link-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      text-decoration: none;
    }
    @media (max-width: 600px) {
      body {
        align-items: flex-start;
        padding: 0.75rem;
      }
      .search-card {
        padding: 1.25rem;
        border-radius: 0.75rem;
      }
    }
  </style>
</head>

<body>
  <div class="search-card">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="mb-0">Multi Search Tool</h1>
      <button id="themeToggle" class="btn btn-outline-primary" aria-label="Växla mörkt/ljust läge">
        <i class="fas fa-moon"></i> Mörkt läge
      </button>
    </div>

    <form id="searchForm">
      <div class="mb-3">
        <label for="searchTerm" class="form-label">Sökord:</label>
        <input type="text" id="searchTerm" name="searchTerm" class="form-control" required>
      </div>

      <div class="mb-3">
        <label for="location" class="form-label">Plats:</label>
        <select id="location" name="location" class="form-select">
          <option value="">Hela Sverige</option>
          <option value="stockholm">Stockholm</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Prisintervall:</label>
        <div class="d-flex">
          <input type="number" id="minPrice" name="minPrice" class="form-control me-2" placeholder="Min" min="0">
          <input type="number" id="maxPrice" name="maxPrice" class="form-control" placeholder="Max" min="0">
        </div>
        <div id="priceError" class="text-danger small mt-1" style="display:none">Minpris kan inte vara högre än maxpris.</div>
      </div>

      <div class="mb-3">
        <div class="form-check">
          <input type="checkbox" id="sortRecent" name="sortRecent" class="form-check-input">
          <label class="form-check-label" for="sortRecent">Sortera efter senaste</label>
        </div>
      </div>

      <div class="mb-2">
        <div class="d-flex justify-content-between align-items-center">
          <label class="form-label mb-0">Välj sökplatser:</label>
          <button type="button" id="toggleAllSites" class="btn btn-sm btn-outline-secondary">Avmarkera alla</button>
        </div>
        <div class="small text-muted mb-2">
          Badges:
          <span class="badge bg-secondary">Plats</span>
          <span class="badge bg-info text-dark">Pris</span>
          <span class="badge bg-warning text-dark">Nyast</span>
        </div>

        <!-- Blocket -->
        <div class="form-check">
          <input type="checkbox" id="blocket" name="searchSites" value="blocket" class="form-check-input" checked>
          <label class="form-check-label" for="blocket">
            Blocket
            <span class="badge bg-secondary ms-2">Plats</span>
            <span class="badge bg-info text-dark ms-1">Pris</span>
            <span class="badge bg-warning text-dark ms-1">Nyast</span>
          </label>
        </div>

        <!-- Tradera -->
        <div class="form-check">
          <input type="checkbox" id="tradera" name="searchSites" value="tradera" class="form-check-input" checked>
          <label class="form-check-label" for="tradera">
            Tradera
            <span class="badge bg-secondary ms-2">Plats</span>
            <span class="badge bg-info text-dark ms-1">Pris</span>
            <span class="badge bg-warning text-dark ms-1">Nyast</span>
          </label>
        </div>

        <!-- Facebook -->
        <div class="form-check">
          <input type="checkbox" id="facebook" name="searchSites" value="facebook" class="form-check-input" checked>
          <label class="form-check-label" for="facebook">
            Facebook Marketplace
            <span class="badge bg-secondary ms-2">Plats</span>
            <span class="badge bg-info text-dark ms-1">Pris</span>
            <span class="badge bg-warning text-dark ms-1">Nyast</span>
          </label>
        </div>

        <!-- Vinted -->
        <div class="form-check">
          <input type="checkbox" id="vinted" name="searchSites" value="vinted" class="form-check-input" checked>
          <label class="form-check-label" for="vinted">
            Vinted
            <span class="badge bg-info text-dark ms-2">Pris</span>
            <span class="badge bg-warning text-dark ms-1">Nyast</span>
          </label>
        </div>

        <hr class="my-3">

        <!-- Budi -->
        <div class="form-check">
          <input type="checkbox" id="budi" name="searchSites" value="budi" class="form-check-input">
          <label class="form-check-label" for="budi">
            Budi
            <span class="badge bg-secondary ms-2">Plats</span>
            <span class="badge bg-warning text-dark ms-1">Nyast</span>
          </label>
        </div>

        <!-- PS Auction -->
        <div class="form-check">
          <input type="checkbox" id="psauction" name="searchSites" value="psauction" class="form-check-input">
          <label class="form-check-label" for="psauction">
            PS Auction
            <span class="badge bg-warning text-dark ms-2">Nyast</span>
          </label>
        </div>

        <!-- Auctionet -->
        <div class="form-check">
          <input type="checkbox" id="auctionet" name="searchSites" value="auctionet" class="form-check-input">
          <label class="form-check-label" for="auctionet">
            Auctionet
            <span class="badge bg-warning text-dark ms-2">Nyast</span>
          </label>
        </div>

        <!-- Pantbanken -->
        <div class="form-check">
          <input type="checkbox" id="pantbanken" name="searchSites" value="pantbanken" class="form-check-input">
          <label class="form-check-label" for="pantbanken">
            Pantbanken
            <span class="badge bg-info text-dark ms-2">Pris</span>
            <span class="badge bg-warning text-dark ms-1">Nyast</span>
          </label>
        </div>

        <!-- Bukowskis -->
        <div class="form-check">
          <input type="checkbox" id="bukowskis" name="searchSites" value="bukowskis" class="form-check-input">
          <label class="form-check-label" for="bukowskis">
            Bukowskis
            <span class="badge bg-light text-dark ms-2">Sök</span>
          </label>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 btn-search">
        <i class="fas fa-search me-2"></i> Sök
      </button>
    </form>

    <div id="searchLinksSection" class="mt-4" style="display:none">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h5 class="mb-0"><i class="fas fa-external-link-alt me-1"></i> Tryck för att öppna:</h5>
        <button type="button" id="closeLinksSection" class="btn btn-sm btn-outline-secondary" aria-label="Stäng länklista">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div id="searchLinksList" class="d-grid gap-2"></div>
    </div>

    <div id="savedSearchesSection" class="mt-4">
      <h5 class="mb-2"><i class="fas fa-star text-warning me-1"></i> Sparade sökningar:</h5>
      <ul id="savedList" class="list-group"></ul>
    </div>

    <div id="searchHistory" class="mt-4">
      <div class="d-flex justify-content-between align-items-center">
        <h5 class="mb-0">Sökhistorik:</h5>
        <button id="clearAllHistory" class="btn btn-sm btn-outline-danger" aria-label="Rensa all sökhistorik">
          <i class="fas fa-trash-alt"></i> Rensa allt
        </button>
      </div>
      <ul id="historyList" class="list-group mt-2"></ul>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      loadPreviousSettings();
      displaySavedSearches();
      displaySearchHistory();
      document.getElementById('clearAllHistory').addEventListener('click', clearAllSearchHistory);
      document.getElementById('closeLinksSection').addEventListener('click', function () {
        document.getElementById('searchLinksSection').style.display = 'none';
      });

      const toggleBtn = document.getElementById('toggleAllSites');
      toggleBtn.addEventListener('click', function () {
        const checkboxes = document.querySelectorAll('input[name="searchSites"]');
        const allChecked = Array.from(checkboxes).every(cb => cb.checked);
        checkboxes.forEach(cb => cb.checked = !allChecked);
        toggleBtn.textContent = allChecked ? 'Välj alla' : 'Avmarkera alla';
      });

      document.querySelectorAll('input[name="searchSites"]').forEach(cb => {
        cb.addEventListener('change', updateToggleButtonLabel);
      });
    });

    function updateToggleButtonLabel() {
      const checkboxes = document.querySelectorAll('input[name="searchSites"]');
      const allChecked = Array.from(checkboxes).every(cb => cb.checked);
      document.getElementById('toggleAllSites').textContent = allChecked ? 'Avmarkera alla' : 'Välj alla';
    }

    document.getElementById('searchForm').addEventListener('submit', function (event) {
      event.preventDefault();
      handleSearch();
    });

    document.getElementById('themeToggle').addEventListener('click', function() {
      document.body.classList.toggle('dark-mode');
      const icon = this.querySelector('i');

      if (document.body.classList.contains('dark-mode')) {
        icon.classList.replace('fa-moon', 'fa-sun');
        icon.nextSibling.textContent = ' Ljust läge';
        localStorage.setItem('darkMode', 'true');
      } else {
        icon.classList.replace('fa-sun', 'fa-moon');
        icon.nextSibling.textContent = ' Mörkt läge';
        localStorage.setItem('darkMode', 'false');
      }
    });

    function loadPreviousSettings() {
      const savedSearchTerm = localStorage.getItem('searchTerm');
      const savedSortRecent = localStorage.getItem('sortRecent') === 'true';
      const savedSearchSites = JSON.parse(localStorage.getItem('searchSites')) || ['blocket', 'tradera', 'facebook', 'vinted'];
      const savedSelectedLocation = localStorage.getItem('location');
      const savedMinPrice = localStorage.getItem('minPrice');
      const savedMaxPrice = localStorage.getItem('maxPrice');
      const savedDarkMode = localStorage.getItem('darkMode') === 'true';

      if (savedSearchTerm) document.getElementById('searchTerm').value = savedSearchTerm;
      document.getElementById('sortRecent').checked = savedSortRecent;
      if (savedSelectedLocation) document.getElementById('location').value = savedSelectedLocation;
      if (savedMinPrice) document.getElementById('minPrice').value = savedMinPrice;
      if (savedMaxPrice) document.getElementById('maxPrice').value = savedMaxPrice;

      // Reset ALL site checkboxes first (important if defaults differ from stored)
      document.querySelectorAll('input[name="searchSites"]').forEach(cb => cb.checked = false);
      savedSearchSites.forEach(site => {
        const el = document.getElementById(site);
        if (el) el.checked = true;
      });

      if (savedDarkMode) {
        document.body.classList.add('dark-mode');
        document.getElementById('themeToggle').innerHTML = '<i class="fas fa-sun"></i> Ljust läge';
      }
    }

    function handleSearch() {
      const searchTerm = document.getElementById('searchTerm').value.trim();
      const sortRecent = document.getElementById('sortRecent').checked;
      const searchSites = Array.from(document.querySelectorAll('input[name="searchSites"]:checked')).map(el => el.value);
      const selectedLocation = document.getElementById('location').value;
      const minPrice = document.getElementById('minPrice').value;
      const maxPrice = document.getElementById('maxPrice').value;

      // Validera prisintervall
      const priceError = document.getElementById('priceError');
      if (minPrice && maxPrice && Number(minPrice) > Number(maxPrice)) {
        priceError.style.display = '';
        return;
      }
      priceError.style.display = 'none';

      localStorage.setItem('searchTerm', searchTerm);
      localStorage.setItem('sortRecent', sortRecent);
      localStorage.setItem('searchSites', JSON.stringify(searchSites));
      localStorage.setItem('location', selectedLocation);
      localStorage.setItem('minPrice', minPrice);
      localStorage.setItem('maxPrice', maxPrice);

      if (searchTerm) {
        const results = getUrls(searchTerm, sortRecent, searchSites, selectedLocation, minPrice, maxPrice);
        if (isMobileDevice()) {
          showSearchLinks(results);
          document.getElementById('searchLinksSection').scrollIntoView({ behavior: 'smooth' });
        } else {
          results.forEach(({ url }) => window.open(url, '_blank'));
        }
        addToSearchHistory(searchTerm);
      }
    }

    function isMobileDevice() {
      return /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
        (navigator.maxTouchPoints > 1 && /Mobi|Tablet/i.test(navigator.userAgent));
    }

    function showSearchLinks(results) {
      const list = document.getElementById('searchLinksList');
      list.innerHTML = '';
      results.forEach(({ label, url }) => {
        const a = document.createElement('a');
        a.href = url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.className = 'btn btn-outline-primary search-link-btn';

        const span = document.createElement('span');
        const icon = document.createElement('i');
        icon.className = 'fas fa-external-link-alt me-2';
        span.appendChild(icon);
        span.appendChild(document.createTextNode(label));

        const chevron = document.createElement('i');
        chevron.className = 'fas fa-chevron-right';

        a.appendChild(span);
        a.appendChild(chevron);
        list.appendChild(a);
      });
      document.getElementById('searchLinksSection').style.display = '';
    }

    function getUrls(searchTerm, sortRecent, searchSites, selectedLocation, minPrice, maxPrice) {
      const encodedTerm = encodeURIComponent(searchTerm);
      const results = [];

      // Blocket
      if (searchSites.includes('blocket')) {
        let url = 'https://www.blocket.se';
        if (selectedLocation === 'stockholm') {
          url += '/annonser/stockholm/hela_stockholm';
        } else {
          url += '/annonser/hela_sverige';
        }
        url += `?q=${encodedTerm}`;
        if (sortRecent) url += '&sort=date';
        if (minPrice) url += `&price_start=${minPrice}`;
        if (maxPrice) url += `&price_end=${maxPrice}`;
        if (selectedLocation === 'stockholm') url += '&r=11';
        results.push({ label: 'Blocket', url });
      }

      // Tradera
      if (searchSites.includes('tradera')) {
        let url = `https://www.tradera.com/search?q=${encodedTerm}`;
        if (sortRecent) url += '&sortBy=AddedOn';
        if (selectedLocation === 'stockholm') url += '&location=Stockholm';
        if (minPrice) url += `&fromPrice=${minPrice}`;
        if (maxPrice) url += `&toPrice=${maxPrice}`;
        results.push({ label: 'Tradera', url });
      }

      // Facebook Marketplace
      // - Om Stockholm är valt: lås till /marketplace/stockholm/
      // - Om Hela Sverige: använd /marketplace/search (FB använder då din konto-/browser-location)
      if (searchSites.includes('facebook')) {
        let url;
        if (selectedLocation === 'stockholm') {
          url = `https://www.facebook.com/marketplace/stockholm/search?query=${encodedTerm}&exact=false`;
        } else {
          url = `https://www.facebook.com/marketplace/search?query=${encodedTerm}&exact=false`;
        }
        if (sortRecent) url += '&daysSinceListed=7';
        if (minPrice) url += `&minPrice=${minPrice}`;
        if (maxPrice) url += `&maxPrice=${maxPrice}`;
        results.push({ label: 'Facebook Marketplace', url });
      }

      // Budi
      if (searchSites.includes('budi')) {
        let url = `https://www.budi.se/objekt?q=${encodedTerm}`;
        if (sortRecent) url += `&s=new`;
        if (selectedLocation === 'stockholm') url += `&l=stockholm`;
        results.push({ label: 'Budi', url });
      }

      // PS Auction
      if (searchSites.includes('psauction')) {
        let url = `https://psauction.se/search/sok=${encodedTerm}`;
        if (sortRecent) url += `&sortering=nyast`;
        results.push({ label: 'PS Auction', url });
      }

      // Auctionet
      if (searchSites.includes('auctionet')) {
        let url = `https://auctionet.com/sv/search?q=${encodedTerm}`;
        if (sortRecent) url += `&order=recent`;
        results.push({ label: 'Auctionet', url });
      }

      // Pantbanken
      if (searchSites.includes('pantbanken')) {
        let url = `https://www.pantbanken.se/auktioner/?fran_form=1&fritext=${encodedTerm}&length=100`;
        if (minPrice) url += `&pris_min=${minPrice}`;
        if (maxPrice) url += `&pris_max=${maxPrice}`;
        if (sortRecent) url += `&sortering=f_id%20desc`;
        results.push({ label: 'Pantbanken', url });
      }

      // Vinted
      if (searchSites.includes('vinted')) {
        let url = `https://www.vinted.se/catalog?search_text=${encodedTerm}`;
        if (sortRecent) url += '&order=newest_first';
        if (minPrice) url += `&price_from=${minPrice}`;
        if (maxPrice) url += `&price_to=${maxPrice}`;
        results.push({ label: 'Vinted', url });
      }

      // Bukowskis (path-baserad sök)
      if (searchSites.includes('bukowskis')) {
        results.push({
          label: 'Bukowskis',
          url: `https://www.bukowskis.com/sv/lots/search/${encodedTerm}`
        });
      }

      return results;
    }

    function addToSearchHistory(searchTerm) {
      let history = JSON.parse(localStorage.getItem('searchHistory')) || [];

      // Ta bort ev. dublett (case-insensitive)
      history = history.filter(term => term.toLowerCase() !== searchTerm.toLowerCase());

      // Lägg till först
      history.unshift(searchTerm);

      // Max 10 unika
      history = history.slice(0, 10);

      localStorage.setItem('searchHistory', JSON.stringify(history));
      displaySearchHistory();
    }

    function displaySearchHistory() {
      const historyList = document.getElementById('historyList');
      historyList.innerHTML = '';
      const history = JSON.parse(localStorage.getItem('searchHistory')) || [];

      history.forEach((term, index) => {
        const li = document.createElement('li');
        li.className = 'list-group-item d-flex justify-content-between align-items-center';

        const termSpan = document.createElement('span');
        termSpan.textContent = term;
        li.appendChild(termSpan);

        const buttonGroup = document.createElement('div');

        const saveButton = document.createElement('button');
        saveButton.className = 'btn btn-sm btn-outline-warning me-1';
        saveButton.innerHTML = '<i class="fas fa-star"></i>';
        saveButton.title = 'Spara sökning';
        saveButton.setAttribute('aria-label', 'Spara sökning: ' + term);
        saveButton.onclick = function() {
          saveSearch(term);
        };

        const searchButton = document.createElement('button');
        searchButton.className = 'btn btn-sm btn-outline-primary me-1';
        searchButton.innerHTML = '<i class="fas fa-search"></i>';
        searchButton.title = 'Sök igen';
        searchButton.setAttribute('aria-label', 'Sök igen: ' + term);
        searchButton.onclick = function() {
          document.getElementById('searchTerm').value = term;
          handleSearch();
        };

        const deleteButton = document.createElement('button');
        deleteButton.className = 'btn btn-sm btn-outline-danger';
        deleteButton.innerHTML = '<i class="fas fa-times"></i>';
        deleteButton.title = 'Ta bort';
        deleteButton.setAttribute('aria-label', 'Ta bort: ' + term);
        deleteButton.onclick = function() {
          removeFromSearchHistory(index);
        };

        buttonGroup.appendChild(saveButton);
        buttonGroup.appendChild(searchButton);
        buttonGroup.appendChild(deleteButton);
        li.appendChild(buttonGroup);
        historyList.appendChild(li);
      });
    }

    function removeFromSearchHistory(index) {
      let history = JSON.parse(localStorage.getItem('searchHistory')) || [];
      history.splice(index, 1);
      localStorage.setItem('searchHistory', JSON.stringify(history));
      displaySearchHistory();
    }

    function clearAllSearchHistory() {
      localStorage.removeItem('searchHistory');
      displaySearchHistory();
    }

    function saveSearch(term) {
      let saved = JSON.parse(localStorage.getItem('savedSearches')) || [];
      if (saved.some(s => s.toLowerCase() === term.toLowerCase())) return;
      saved.unshift(term);
      localStorage.setItem('savedSearches', JSON.stringify(saved));
      displaySavedSearches();
    }

    function removeSavedSearch(index) {
      let saved = JSON.parse(localStorage.getItem('savedSearches')) || [];
      saved.splice(index, 1);
      localStorage.setItem('savedSearches', JSON.stringify(saved));
      displaySavedSearches();
    }

    function displaySavedSearches() {
      const savedList = document.getElementById('savedList');
      const section = document.getElementById('savedSearchesSection');
      savedList.innerHTML = '';
      const saved = JSON.parse(localStorage.getItem('savedSearches')) || [];

      section.style.display = saved.length === 0 ? 'none' : '';

      saved.forEach((term, index) => {
        const li = document.createElement('li');
        li.className = 'list-group-item d-flex justify-content-between align-items-center';

        const termSpan = document.createElement('span');
        termSpan.textContent = term;
        li.appendChild(termSpan);

        const buttonGroup = document.createElement('div');

        const searchButton = document.createElement('button');
        searchButton.className = 'btn btn-sm btn-outline-primary me-1';
        searchButton.innerHTML = '<i class="fas fa-search"></i>';
        searchButton.title = 'Sök igen';
        searchButton.setAttribute('aria-label', 'Sök igen: ' + term);
        searchButton.onclick = function() {
          document.getElementById('searchTerm').value = term;
          handleSearch();
        };

        const deleteButton = document.createElement('button');
        deleteButton.className = 'btn btn-sm btn-outline-danger';
        deleteButton.innerHTML = '<i class="fas fa-times"></i>';
        deleteButton.title = 'Ta bort sparad sökning';
        deleteButton.setAttribute('aria-label', 'Ta bort sparad sökning: ' + term);
        deleteButton.onclick = function() {
          removeSavedSearch(index);
        };

        buttonGroup.appendChild(searchButton);
        buttonGroup.appendChild(deleteButton);
        li.appendChild(buttonGroup);
        savedList.appendChild(li);
      });
    }
  </script>
</body>
</html>
