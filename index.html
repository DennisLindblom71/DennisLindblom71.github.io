<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avancerad Multi Search Tool</title>
  <meta name="description" content="Sök på flera svenska marknadsplatser samtidigt – Blocket, Tradera, Facebook Marketplace, Vinted med flera.">
  <meta name="theme-color" content="#0d6efd">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">

  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f8f9fa;
      transition: background-color 0.3s ease;
    }
    .search-card {
      width: 100%;
      max-width: 650px;
      padding: 2rem;
      background-color: #ffffff;
      border-radius: 1rem;
      box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
      transition: background-color 0.3s ease;
    }
    .btn-search {
      transition: all 0.3s ease;
    }
    .btn-search:hover {
      transform: translateY(-2px);
      box-shadow: 0 0.25rem 0.5rem rgba(0, 0, 0, 0.2);
    }
    .form-check-input:checked {
      background-color: #0d6efd;
      border-color: #0d6efd;
    }
    .dark-mode {
      background-color: #333;
      color: #fff;
    }
    .dark-mode .search-card {
      background-color: #444;
      color: #fff;
    }
    .dark-mode .form-control,
    .dark-mode .form-select {
      background-color: #555;
      color: #fff;
      border-color: #666;
    }
    .dark-mode .list-group-item {
      background-color: #555;
      color: #fff;
      border-color: #666;
    }
    .search-link-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      text-decoration: none;
    }
    @media (max-width: 600px) {
      body {
        align-items: flex-start;
        padding: 0.75rem;
      }
      .search-card {
        padding: 1.25rem;
        border-radius: 0.75rem;
      }
    }
  </style>
</head>

<body>
  <div class="search-card">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="mb-0">Multi Search Tool</h1>
      <button id="themeToggle" class="btn btn-outline-primary" aria-label="Växla mörkt/ljust läge">
        <i class="fas fa-moon"></i> Mörkt läge
      </button>
    </div>

    <form id="searchForm">
      <div class="mb-3">
        <label for="searchTerm" class="form-label">Sökord:</label>
        <input type="text" id="searchTerm" name="searchTerm" class="form-control" required>
      </div>

      <div class="mb-3">
        <label for="location" class="form-label">Plats:</label>
        <select id="location" name="location" class="form-select">
          <option value="">Hela Sverige</option>
          <option value="stockholm">Stockholm</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Prisintervall:</label>
        <div class="d-flex">
          <input type="number" id="minPrice" name="minPrice" class="form-control me-2" placeholder="Min" min="0">
          <input type="number" id="maxPrice" name="maxPrice" class="form-control" placeholder="Max" min="0">
        </div>
        <div id="priceError" class="text-danger small mt-1" style="display:none">Minpris kan inte vara högre än maxpris.</div>
      </div>

      <div class="mb-3">
        <div class="form-check">
          <input type="checkbox" id="sortRecent" name="sortRecent" class="form-check-input">
          <label class="form-check-label" for="sortRecent">Sortera efter senaste</label>
        </div>
      </div>

      <div class="mb-2">
        <div class="d-flex justify-content-between align-items-center">
          <label class="form-label mb-0">Välj sökplatser:</label>
          <button type="button" id="toggleAllSites" class="btn btn-sm btn-outline-secondary">Avmarkera alla</button>
        </div>
        <div class="small text-muted mb-2">
          Badges:
          <span class="badge bg-secondary">Plats</span>
          <span class="badge bg-info text-dark">Pris</span>
          <span class="badge bg-warning text-dark">Nyast</span>
        </div>

        <!-- Blocket -->
        <div class="form-check">
          <input type="checkbox" id="blocket" name="searchSites" value="blocket" class="form-check-input" checked>
          <label class="form-check-label" for="blocket">
            Blocket
            <span class="badge bg-secondary ms-2">Plats</span>
            <span class="badge bg-info text-dark ms-1">Pris</span>
            <span class="badge bg-warning text-dark ms-1">Nyast</span>
          </label>
        </div>

        <!-- Tradera -->
        <div class="form-check">
          <input type="checkbox" id="tradera" name="searchSites" value="tradera" class="form-check-input" checked>
          <label class="form-check-label" for="tradera">
            Tradera
            <span class="badge bg-secondary ms-2">Plats</span>
            <span class="badge bg-info text-dark ms-1">Pris</span>
            <span class="badge bg-warning text-dark ms-1">Nyast</span>
          </label>
        </div>

        <!-- Facebook -->
        <div class="form-check">
          <input type="checkbox" id="facebook" name="searchSites" value="facebook" class="form-check-input" checked>
          <label class="form-check-label" for="facebook">
            Facebook Marketplace
            <span class="badge bg-secondary ms-2">Plats</span>
            <span class="badge bg-info text-dark ms-1">Pris</span>
            <span class="badge bg-warning text-dark ms-1">Nyast</span>
          </label>
        </div>

        <!-- Vinted -->
        <div class="form-check">
          <input type="checkbox" id="vinted" name="searchSites" value="vinted" class="form-check-input" checked>
          <label class="form-check-label" for="vinted">
            Vinted
            <span class="badge bg-info text-dark ms-2">Pris</span>
            <span class="badge bg-warning text-dark ms-1">Nyast</span>
          </label>
        </div>

        <!-- Sellpy -->
        <div class="form-check">
          <input type="checkbox" id="sellpy" name="searchSites" value="sellpy" class="form-check-input" checked>
          <label class="form-check-label" for="sellpy">
            Sellpy
            <span class="badge bg-info text-dark ms-2">Pris</span>
            <span class="badge bg-warning text-dark ms-1">Nyast</span>
          </label>
        </div>

        <hr class="my-3">

        <!-- Budi -->
        <div class="form-check">
          <input type="checkbox" id="budi" name="searchSites" value="budi" class="form-check-input">
          <label class="form-check-label" for="budi">
            Budi
            <span class="badge bg-secondary ms-2">Plats</span>
            <span class="badge bg-warning text-dark ms-1">Nyast</span>
          </label>
        </div>

        <!-- PS Auction -->
        <div class="form-check">
          <input type="checkbox" id="psauction" name="searchSites" value="psauction" class="form-check-input">
          <label class="form-check-label" for="psauction">
            PS Auction
            <span class="badge bg-warning text-dark ms-2">Nyast</span>
          </label>
        </div>

        <!-- Auctionet -->
        <div class="form-check">
          <input type="checkbox" id="auctionet" name="searchSites" value="auctionet" class="form-check-input">
          <label class="form-check-label" for="auctionet">
            Auctionet
            <span class="badge bg-warning text-dark ms-2">Nyast</span>
          </label>
        </div>

        <!-- Pantbanken -->
        <div class="form-check">
          <input type="checkbox" id="pantbanken" name="searchSites" value="pantbanken" class="form-check-input">
          <label class="form-check-label" for="pantbanken">
            Pantbanken
            <span class="badge bg-info text-dark ms-2">Pris</span>
            <span class="badge bg-warning text-dark ms-1">Nyast</span>
          </label>
        </div>

        <!-- Bukowskis -->
        <div class="form-check">
          <input type="checkbox" id="bukowskis" name="searchSites" value="bukowskis" class="form-check-input">
          <label class="form-check-label" for="bukowskis">
            Bukowskis
            <span class="badge bg-light text-dark ms-2">Sök</span>
          </label>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 btn-search">
        <i class="fas fa-search me-2"></i> Sök
      </button>
    </form>

    <div id="searchLinksSection" class="mt-4" style="display:none">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h5 class="mb-0 text-truncate me-2"><i class="fas fa-list-check me-1"></i> <span id="linksTerm"></span></h5>
        <button type="button" id="closeLinksSection" class="btn btn-sm btn-outline-secondary" aria-label="Stäng länklista">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div id="blockedNotice" class="alert alert-warning small py-2" style="display:none"></div>
      <a id="nextSiteBtn" class="btn btn-success btn-lg w-100 mb-1" target="_blank" rel="noopener noreferrer"></a>
      <div id="linksProgress" class="small text-muted text-center mb-3"></div>
      <div id="searchLinksList" class="d-grid gap-2"></div>
    </div>

    <div id="savedSearchesSection" class="mt-4">
      <h5 class="mb-2"><i class="fas fa-star text-warning me-1"></i> Sparade sökningar:</h5>
      <ul id="savedList" class="list-group"></ul>
    </div>

    <!-- Påminnelse-modal -->
    <div id="reminderModal" class="modal fade" tabindex="-1">
      <div class="modal-dialog modal-sm modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title"><i class="fas fa-bell me-2"></i>Påminnelse</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Stäng"></button>
          </div>
          <div class="modal-body">
            <p class="mb-2">Påminn mig om att söka efter "<strong id="reminderTermDisplay"></strong>":</p>
            <div class="d-grid gap-2">
              <button class="btn btn-outline-primary reminder-opt" data-minutes="30">Om 30 minuter</button>
              <button class="btn btn-outline-primary reminder-opt" data-minutes="60">Om 1 timme</button>
              <button class="btn btn-outline-primary reminder-opt" data-minutes="240">Om 4 timmar</button>
              <button class="btn btn-outline-primary reminder-opt" data-minutes="1440">Om 1 dag</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="searchHistory" class="mt-4">
      <div class="d-flex justify-content-between align-items-center">
        <h5 class="mb-0">Sökhistorik:</h5>
        <button id="clearAllHistory" class="btn btn-sm btn-outline-danger" aria-label="Rensa all sökhistorik">
          <i class="fas fa-trash-alt"></i> Rensa allt
        </button>
      </div>
      <ul id="historyList" class="list-group mt-2"></ul>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // ---------- Hjälpfunktioner ----------
    function readJSON(key, fallback) {
      try {
        const v = JSON.parse(localStorage.getItem(key));
        return v == null ? fallback : v;
      } catch (e) {
        return fallback;
      }
    }

    function writeJSON(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* privat läge m.m. */ }
    }

    function isIOS() {
      return /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); // iPadOS
    }

    function isMobileDevice() {
      return isIOS() || /Android/i.test(navigator.userAgent) ||
        (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
    }

    // Påminnelser kräver notiser. iOS stöder inte lokala webbnotiser, så där döljs funktionen.
    function remindersSupported() {
      return 'Notification' in window && !isIOS();
    }

    const DEFAULT_SITES = ['blocket', 'tradera', 'facebook', 'vinted', 'sellpy'];

    // ---------- Formulärets tillstånd ----------
    function getFormState() {
      return {
        term: document.getElementById('searchTerm').value.trim(),
        sites: Array.from(document.querySelectorAll('input[name="searchSites"]:checked')).map(el => el.value),
        location: document.getElementById('location').value,
        minPrice: document.getElementById('minPrice').value,
        maxPrice: document.getElementById('maxPrice').value,
        sortRecent: document.getElementById('sortRecent').checked
      };
    }

    function applyState(s) {
      document.getElementById('searchTerm').value = s.term || '';
      // Äldre sparade sökningar har bara sökord – behåll då nuvarande filter
      if (Array.isArray(s.sites)) {
        document.querySelectorAll('input[name="searchSites"]').forEach(cb => {
          cb.checked = s.sites.includes(cb.value);
        });
        document.getElementById('location').value = s.location || '';
        document.getElementById('minPrice').value = s.minPrice || '';
        document.getElementById('maxPrice').value = s.maxPrice || '';
        document.getElementById('sortRecent').checked = !!s.sortRecent;
      }
      updateToggleButtonLabel();
    }

    // Gamla poster var bara strängar – gör om till objekt
    function normalize(entry) {
      return typeof entry === 'string' ? { term: entry, sites: null } : entry;
    }

    function describe(s) {
      if (!Array.isArray(s.sites)) return '';
      const parts = [`${s.sites.length} sajter`];
      if (s.minPrice || s.maxPrice) parts.push(`${s.minPrice || 0}–${s.maxPrice || '∞'} kr`);
      if (s.location === 'stockholm') parts.push('Stockholm');
      if (s.sortRecent) parts.push('nyast');
      return parts.join(' · ');
    }

    // ---------- Start ----------
    document.addEventListener('DOMContentLoaded', function () {
      loadPreviousSettings();
      displaySavedSearches();
      displaySearchHistory();
      restoreRun();

      document.getElementById('clearAllHistory').addEventListener('click', clearAllSearchHistory);
      document.getElementById('closeLinksSection').addEventListener('click', function () {
        document.getElementById('searchLinksSection').style.display = 'none';
        try { localStorage.removeItem('currentRun'); } catch (e) {}
        currentRun = null;
      });
      document.getElementById('nextSiteBtn').addEventListener('click', onNextSiteClick);

      const toggleBtn = document.getElementById('toggleAllSites');
      toggleBtn.addEventListener('click', function () {
        const checkboxes = document.querySelectorAll('input[name="searchSites"]');
        const allChecked = Array.from(checkboxes).every(cb => cb.checked);
        checkboxes.forEach(cb => cb.checked = !allChecked);
        updateToggleButtonLabel();
      });

      document.querySelectorAll('input[name="searchSites"]').forEach(cb => {
        cb.addEventListener('change', updateToggleButtonLabel);
      });

      if (remindersSupported()) {
        const reminders = readJSON('reminders', []);
        if (reminders.length > 0 && Notification.permission === 'default') {
          Notification.requestPermission();
        }
        checkReminders();
        setInterval(checkReminders, 30000);
      }
    });

    function updateToggleButtonLabel() {
      const checkboxes = document.querySelectorAll('input[name="searchSites"]');
      const allChecked = Array.from(checkboxes).every(cb => cb.checked);
      document.getElementById('toggleAllSites').textContent = allChecked ? 'Avmarkera alla' : 'Välj alla';
    }

    document.getElementById('searchForm').addEventListener('submit', function (event) {
      event.preventDefault();
      handleSearch();
    });

    document.getElementById('themeToggle').addEventListener('click', function () {
      const dark = document.body.classList.toggle('dark-mode');
      this.innerHTML = dark ? '<i class="fas fa-sun"></i> Ljust läge' : '<i class="fas fa-moon"></i> Mörkt läge';
      try { localStorage.setItem('darkMode', String(dark)); } catch (e) {}
    });

    function loadPreviousSettings() {
      const last = readJSON('lastSearch', null);
      if (last) {
        applyState(last);
      } else {
        // Migrering från äldre version som sparade varje fält separat
        applyState({
          term: localStorage.getItem('searchTerm') || '',
          sites: readJSON('searchSites', DEFAULT_SITES),
          location: localStorage.getItem('location') || '',
          minPrice: localStorage.getItem('minPrice') || '',
          maxPrice: localStorage.getItem('maxPrice') || '',
          sortRecent: localStorage.getItem('sortRecent') === 'true'
        });
      }

      if (localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('dark-mode');
        document.getElementById('themeToggle').innerHTML = '<i class="fas fa-sun"></i> Ljust läge';
      }
    }

    function handleSearch() {
      const state = getFormState();

      const priceError = document.getElementById('priceError');
      if (state.minPrice && state.maxPrice && Number(state.minPrice) > Number(state.maxPrice)) {
        priceError.style.display = '';
        return;
      }
      priceError.style.display = 'none';

      writeJSON('lastSearch', state);
      if (!state.term || state.sites.length === 0) return;

      const results = getUrls(state.term, state.sortRecent, state.sites, state.location, state.minPrice, state.maxPrice);
      addToSearchHistory(state);

      if (isMobileDevice()) {
        startRun(state.term, results, []);
      } else {
        // Dator: öppna alla direkt. Blockerade flikar visas som länkar i stället.
        const visited = [];
        results.forEach(({ url }, i) => {
          if (window.open(url, '_blank')) visited.push(i);
        });
        if (visited.length < results.length) {
          startRun(state.term, results, visited);
          const notice = document.getElementById('blockedNotice');
          notice.textContent = `Webbläsaren blockerade ${results.length - visited.length} flikar. ` +
            'Tillåt popup-fönster för den här sidan, eller öppna dem här nedanför.';
          notice.style.display = '';
        }
      }
    }

    // ---------- Stegvis öppning ("Nästa sajt") ----------
    let currentRun = null; // { term, results: [{label,url}], visited: [index], ts }

    function startRun(term, results, visited) {
      currentRun = { term, results, visited, ts: Date.now() };
      writeJSON('currentRun', currentRun);
      document.getElementById('blockedNotice').style.display = 'none';
      renderRun();
      document.getElementById('searchLinksSection').scrollIntoView({ behavior: 'smooth' });
    }

    // iOS laddar ofta om sidan när man kommer tillbaka – återställ pågående genomgång
    function restoreRun() {
      const run = readJSON('currentRun', null);
      if (run && Array.isArray(run.results) && Date.now() - run.ts < 6 * 60 * 60 * 1000) {
        currentRun = run;
        renderRun();
        if (nextIndex() !== -1) {
          setTimeout(() => document.getElementById('nextSiteBtn').scrollIntoView({ block: 'center' }), 100);
        }
      }
    }

    function markVisited(index) {
      if (!currentRun || currentRun.visited.includes(index)) return;
      currentRun.visited.push(index);
      writeJSON('currentRun', currentRun);
      // Vänta tills länken har öppnats innan knappen byter adress
      setTimeout(renderRun, 50);
    }

    function nextIndex() {
      return currentRun.results.findIndex((_, i) => !currentRun.visited.includes(i));
    }

    function onNextSiteClick(e) {
      if (!currentRun) return;
      const idx = nextIndex();
      if (idx === -1) {
        e.preventDefault();
        currentRun.visited = [];
        writeJSON('currentRun', currentRun);
        renderRun();
        return;
      }
      markVisited(idx);
    }

    function renderRun() {
      const section = document.getElementById('searchLinksSection');
      if (!currentRun) { section.style.display = 'none'; return; }

      const { term, results, visited } = currentRun;
      document.getElementById('linksTerm').textContent = `"${term}"`;

      const idx = nextIndex();
      const nextBtn = document.getElementById('nextSiteBtn');
      if (idx === -1) {
        nextBtn.removeAttribute('href');
        nextBtn.className = 'btn btn-outline-success btn-lg w-100 mb-1';
        nextBtn.innerHTML = '<i class="fas fa-check-double me-2"></i> Alla kollade – börja om';
      } else {
        nextBtn.href = results[idx].url;
        nextBtn.className = 'btn btn-success btn-lg w-100 mb-1';
        nextBtn.innerHTML = '';
        const icon = document.createElement('i');
        icon.className = 'fas fa-arrow-right me-2';
        nextBtn.appendChild(icon);
        nextBtn.appendChild(document.createTextNode(`Öppna ${results[idx].label}`));
      }
      document.getElementById('linksProgress').textContent =
        `${visited.length} av ${results.length} kollade`;

      const list = document.getElementById('searchLinksList');
      list.innerHTML = '';
      results.forEach(({ label, url }, i) => {
        const done = visited.includes(i);
        const a = document.createElement('a');
        a.href = url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.className = 'btn search-link-btn ' + (done ? 'btn-outline-secondary' : 'btn-outline-primary');
        a.addEventListener('click', () => markVisited(i));

        const span = document.createElement('span');
        const icon = document.createElement('i');
        icon.className = done ? 'fas fa-check-circle text-success me-2' : 'far fa-circle me-2';
        span.appendChild(icon);
        span.appendChild(document.createTextNode(label));

        const chevron = document.createElement('i');
        chevron.className = 'fas fa-chevron-right';

        a.appendChild(span);
        a.appendChild(chevron);
        list.appendChild(a);
      });
      section.style.display = '';
    }

    // ---------- Sök-URL:er ----------
    function getUrls(searchTerm, sortRecent, searchSites, selectedLocation, minPrice, maxPrice) {
      const encodedTerm = encodeURIComponent(searchTerm);
      const results = [];

      // Blocket
      if (searchSites.includes('blocket')) {
        let url = 'https://www.blocket.se';
        if (selectedLocation === 'stockholm') {
          url += '/annonser/stockholm/hela_stockholm';
        } else {
          url += '/annonser/hela_sverige';
        }
        url += `?q=${encodedTerm}`;
        if (sortRecent) url += '&sort=date';
        if (minPrice) url += `&price_start=${minPrice}`;
        if (maxPrice) url += `&price_end=${maxPrice}`;
        if (selectedLocation === 'stockholm') url += '&r=11';
        results.push({ label: 'Blocket', url });
      }

      // Tradera
      if (searchSites.includes('tradera')) {
        let url = `https://www.tradera.com/search?q=${encodedTerm}`;
        if (sortRecent) url += '&sortBy=AddedOn';
        if (selectedLocation === 'stockholm') url += '&location=Stockholm';
        if (minPrice) url += `&fromPrice=${minPrice}`;
        if (maxPrice) url += `&toPrice=${maxPrice}`;
        results.push({ label: 'Tradera', url });
      }

      // Facebook Marketplace
      // - Om Stockholm är valt: lås till /marketplace/stockholm/
      // - Om Hela Sverige: använd /marketplace/search (FB använder då din konto-/browser-location)
      if (searchSites.includes('facebook')) {
        let url;
        if (selectedLocation === 'stockholm') {
          url = `https://www.facebook.com/marketplace/stockholm/search?query=${encodedTerm}&exact=false`;
        } else {
          url = `https://www.facebook.com/marketplace/search?query=${encodedTerm}&exact=false`;
        }
        if (sortRecent) url += '&daysSinceListed=7';
        if (minPrice) url += `&minPrice=${minPrice}`;
        if (maxPrice) url += `&maxPrice=${maxPrice}`;
        results.push({ label: 'Facebook Marketplace', url });
      }

      // Budi
      if (searchSites.includes('budi')) {
        let url = `https://www.budi.se/objekt?q=${encodedTerm}`;
        if (sortRecent) url += `&s=new`;
        if (selectedLocation === 'stockholm') url += `&l=stockholm`;
        results.push({ label: 'Budi', url });
      }

      // PS Auction
      if (searchSites.includes('psauction')) {
        let url = `https://psauction.se/search/sok=${encodedTerm}`;
        if (sortRecent) url += `&sortering=nyast`;
        results.push({ label: 'PS Auction', url });
      }

      // Auctionet
      if (searchSites.includes('auctionet')) {
        let url = `https://auctionet.com/sv/search?q=${encodedTerm}`;
        if (sortRecent) url += `&order=recent`;
        results.push({ label: 'Auctionet', url });
      }

      // Pantbanken
      if (searchSites.includes('pantbanken')) {
        let url = `https://www.pantbanken.se/auktioner/?fran_form=1&fritext=${encodedTerm}&length=100`;
        if (minPrice) url += `&pris_min=${minPrice}`;
        if (maxPrice) url += `&pris_max=${maxPrice}`;
        if (sortRecent) url += `&sortering=f_id%20desc`;
        results.push({ label: 'Pantbanken', url });
      }

      // Vinted
      if (searchSites.includes('vinted')) {
        let url = `https://www.vinted.se/catalog?search_text=${encodedTerm}`;
        if (sortRecent) url += '&order=newest_first';
        if (minPrice) url += `&price_from=${minPrice}`;
        if (maxPrice) url += `&price_to=${maxPrice}`;
        results.push({ label: 'Vinted', url });
      }

      // Sellpy
      if (searchSites.includes('sellpy')) {
        let url = `https://www.sellpy.se/search?query=${encodedTerm}`;
        if (sortRecent) url += '&sortBy=published';
        if (minPrice) url += `&minPrice=${minPrice}`;
        if (maxPrice) url += `&maxPrice=${maxPrice}`;
        results.push({ label: 'Sellpy', url });
      }

      // Bukowskis (path-baserad sök)
      if (searchSites.includes('bukowskis')) {
        results.push({
          label: 'Bukowskis',
          url: `https://www.bukowskis.com/sv/lots/search/${encodedTerm}`
        });
      }

      return results;
    }

    // ---------- Historik och sparade sökningar ----------
    function sameTerm(a, b) {
      return a.term.toLowerCase() === b.term.toLowerCase();
    }

    function addToSearchHistory(state) {
      let history = readJSON('searchHistory', []).map(normalize);
      history = history.filter(h => !sameTerm(h, state));
      history.unshift(state);
      writeJSON('searchHistory', history.slice(0, 10));
      displaySearchHistory();
    }

    function makeIconButton(cls, icon, title, onClick, text) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn btn-sm ' + cls;
      b.innerHTML = `<i class="fas ${icon}"></i>`;
      if (text) b.appendChild(document.createTextNode(' ' + text));
      b.title = title;
      b.setAttribute('aria-label', title);
      b.onclick = onClick;
      return b;
    }

    function makeEntryRow(s, buttons) {
      const li = document.createElement('li');
      li.className = 'list-group-item d-flex justify-content-between align-items-center gap-2';

      const textWrap = document.createElement('div');
      textWrap.className = 'text-truncate';
      const termEl = document.createElement('div');
      termEl.className = 'text-truncate';
      termEl.textContent = s.term;
      textWrap.appendChild(termEl);
      const desc = describe(s);
      if (desc) {
        const small = document.createElement('div');
        small.className = 'small text-muted text-truncate';
        small.textContent = desc;
        textWrap.appendChild(small);
      }
      li.appendChild(textWrap);

      const group = document.createElement('div');
      group.className = 'd-flex align-items-center flex-shrink-0';
      buttons.forEach(b => group.appendChild(b));
      li.appendChild(group);
      return li;
    }

    function searchAgain(s) {
      applyState(s);
      handleSearch();
    }

    function displaySearchHistory() {
      const historyList = document.getElementById('historyList');
      historyList.innerHTML = '';
      const history = readJSON('searchHistory', []).map(normalize);
      document.getElementById('searchHistory').style.display = history.length ? '' : 'none';

      history.forEach((s, index) => {
        historyList.appendChild(makeEntryRow(s, [
          makeIconButton('btn-outline-warning me-1', 'fa-star', 'Spara sökning: ' + s.term, () => saveSearch(s)),
          makeIconButton('btn-outline-primary me-1', 'fa-search', 'Sök igen: ' + s.term, () => searchAgain(s)),
          makeIconButton('btn-outline-danger', 'fa-times', 'Ta bort: ' + s.term, () => removeFromSearchHistory(index))
        ]));
      });
    }

    function removeFromSearchHistory(index) {
      const history = readJSON('searchHistory', []);
      history.splice(index, 1);
      writeJSON('searchHistory', history);
      displaySearchHistory();
    }

    function clearAllSearchHistory() {
      try { localStorage.removeItem('searchHistory'); } catch (e) {}
      displaySearchHistory();
    }

    function saveSearch(s) {
      let saved = readJSON('savedSearches', []).map(normalize);
      // Samma sökord sparas en gång – senaste filtren gäller
      saved = saved.filter(x => !sameTerm(x, s));
      saved.unshift(s);
      writeJSON('savedSearches', saved);
      displaySavedSearches();
    }

    function removeSavedSearch(index) {
      const saved = readJSON('savedSearches', []);
      saved.splice(index, 1);
      writeJSON('savedSearches', saved);
      displaySavedSearches();
    }

    function displaySavedSearches() {
      const savedList = document.getElementById('savedList');
      const section = document.getElementById('savedSearchesSection');
      savedList.innerHTML = '';
      const saved = readJSON('savedSearches', []).map(normalize);
      section.style.display = saved.length === 0 ? 'none' : '';

      saved.forEach((s, index) => {
        const buttons = [];
        if (remindersSupported()) {
          const active = getActiveReminder(s.term);
          buttons.push(active
            ? makeIconButton('btn-warning me-1', 'fa-bell', 'Avbryt påminnelse för: ' + s.term,
                () => cancelReminder(s.term), formatTimeLeft(active.dueAt - Date.now()))
            : makeIconButton('btn-outline-secondary me-1', 'fa-bell', 'Sätt påminnelse för: ' + s.term,
                () => openReminderModal(s.term)));
        }
        buttons.push(makeIconButton('btn-outline-primary me-1', 'fa-search', 'Sök igen: ' + s.term, () => searchAgain(s)));
        buttons.push(makeIconButton('btn-outline-danger', 'fa-times', 'Ta bort sparad sökning: ' + s.term, () => removeSavedSearch(index)));
        savedList.appendChild(makeEntryRow(s, buttons));
      });
    }

    // ---------- Påminnelser (endast där webbnotiser fungerar) ----------
    let reminderTerm = '';

    function openReminderModal(term) {
      reminderTerm = term;
      document.getElementById('reminderTermDisplay').textContent = term;
      bootstrap.Modal.getOrCreateInstance(document.getElementById('reminderModal')).show();
    }

    document.querySelectorAll('.reminder-opt').forEach(btn => {
      btn.addEventListener('click', function () {
        setReminder(reminderTerm, parseInt(this.dataset.minutes, 10));
        bootstrap.Modal.getOrCreateInstance(document.getElementById('reminderModal')).hide();
      });
    });

    function setReminder(term, minutes) {
      if (!remindersSupported()) return;
      if (Notification.permission === 'default') Notification.requestPermission();

      const reminders = readJSON('reminders', []).filter(r => r.term.toLowerCase() !== term.toLowerCase());
      reminders.push({ term, dueAt: Date.now() + minutes * 60 * 1000 });
      writeJSON('reminders', reminders);
      displaySavedSearches();
    }

    function checkReminders() {
      const reminders = readJSON('reminders', []);
      const now = Date.now();
      const remaining = reminders.filter(r => r.dueAt > now);
      reminders.filter(r => r.dueAt <= now).forEach(r => showNotification(r.term));

      writeJSON('reminders', remaining);
      displaySavedSearches(); // uppdaterar även nedräkningen
    }

    function showNotification(term) {
      if (Notification.permission !== 'granted') return;
      const body = `Dags att kolla "${term}" igen!`;
      if (navigator.serviceWorker && navigator.serviceWorker.controller) {
        navigator.serviceWorker.ready.then(reg => reg.showNotification('Multi Search Tool', { body, icon: 'icon-192.png' }));
      } else {
        new Notification('Multi Search Tool', { body, icon: 'icon-192.png' });
      }
    }

    function cancelReminder(term) {
      const reminders = readJSON('reminders', []).filter(r => r.term.toLowerCase() !== term.toLowerCase());
      writeJSON('reminders', reminders);
      displaySavedSearches();
    }

    function getActiveReminder(term) {
      return readJSON('reminders', []).find(r => r.term.toLowerCase() === term.toLowerCase());
    }

    function formatTimeLeft(ms) {
      const mins = Math.max(1, Math.round(ms / 60000));
      if (mins < 60) return `${mins} min`;
      const hours = Math.round(mins / 60);
      if (hours < 24) return `${hours}h`;
      return `${Math.round(hours / 24)}d`;
    }

    // Registrera Service Worker för PWA/offline-stöd
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
